# DKMS 配置 —— bitland-mifs-wmi (gcc-lite Ubuntu 移植)
#
# scripts/install.sh 会自动完成 add/build/install（含 Secure Boot 签名）。
# 手动安装：  sudo dkms add /path/to/linux/driver
#             sudo dkms build   bitland-mifs-wmi/1.0.0
#             sudo dkms install bitland-mifs-wmi/1.0.0
#
# ── 针对 Ubuntu 24.04 自带 dkms 3.4.3 的实测要点 ────────────────────────────
#
# 1) DEST_MODULE_LOCATION 是**必需**指令（缺失会报
#    "No 'DEST_MODULE_LOCATION' directive specified"）。它会打印
#    Deprecated 提示，但删不得。
#
# 2) DKMS 会把源码复制到 /var/lib/dkms/<pkg>/<ver>/build 并在**该目录**里
#    执行 MAKE[0]。若 Makefile 用 $(CURDIR) 作为 Kbuild 的 M= 参数，
#    DKMS 场景下 $(CURDIR) 解析成 /usr/src/<pkg>，.ko 就落到了那里，
#    DKMS 在自己目录里找不到产物 → "binary package not found"。
#    这里不依赖任何环境变量拼接（DKMS 会吃掉 $$ 转义），
#    直接用相对路径 "."，因为 DKMS 已把工作目录切到构建目录。
#
# 3) 注意 CLEAN="..." 字符串形式会产生 "Deprecated feature: CLEAN" 提示，
#    故不再声明；清理交给 Makefile 的 clean 目标。

PACKAGE_NAME="bitland-mifs-wmi"
PACKAGE_VERSION="1.0.0"

BUILT_MODULE_NAME[0]="bitland-mifs-wmi"
DEST_MODULE_LOCATION[0]="/extra"

# Ubuntu DKMS 在存在 /var/lib/shim-signed/mok/MOK.der 时会自动签名；
# install.sh 装完还会再显式签一次做双保险。
AUTOINSTALL="yes"

# 关键：把 DKMS 的构建目录传给 Makefile（见 Makefile 中 MODULE_SRC 说明）。
# dkms 3.4.3 的实际布局是扁平的：
#     /var/lib/dkms/<PACKAGE_NAME>/<PACKAGE_VERSION>/build
# 刻意不使用 $$ 转义（DKMS 配置层会先吃掉一层 $，导致变量被展开成 PID）。
MAKE[0]="make --no-print-directory -C ${source_dir} build KERNELDIR=${kernel_source_dir} MODULE_SRC=/var/lib/dkms/${PACKAGE_NAME}/${PACKAGE_VERSION}/build"
